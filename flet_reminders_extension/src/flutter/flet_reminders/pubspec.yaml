name: flet_reminders
description: Flet FletReminders control
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flet: 0.86.5
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  flutter_local_notifications: ^22.3.1
  flutter_timezone: ^5.1.0
  timezone: ^0.11.0

flutter:
  plugin:
    platforms:
      android:
        package: com.myvault.flet_reminders
        pluginClass: FletRemindersPlugin

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
